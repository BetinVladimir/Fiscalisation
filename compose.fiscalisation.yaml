name: beefiscal-${APP_ENV:-dev}
services:
  postgres:
    image: postgres:16.10
    environment: {POSTGRES_USER: fiscal, POSTGRES_PASSWORD: "${FISCAL_DB_PASSWORD:?required}", POSTGRES_DB: fiscal}
    volumes: [fiscal_pg:/var/lib/postgresql/data, ./database/fiscal:/docker-entrypoint-initdb.d:ro]
    networks: [private]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U fiscal -d fiscal"], interval: 5s, timeout: 3s, retries: 20}
  fiscal-backend:
    build: ./fiscal-backend
    environment: {APP_ENV: "${APP_ENV:-dev}", HTTP_ADDR: ":8080", API_VERSION: "2026-08-07", DATABASE_URL: "postgres://fiscal:${FISCAL_DB_PASSWORD}@${FISCAL_DB_HOST:-postgres}:5432/fiscal?sslmode=disable", AUTH_HMAC_KEY: "${AUTH_HMAC_KEY:-}", OIDC_ISSUER: "${OIDC_ISSUER:-}", OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}", OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}", BLE_SIGNING_KEY: "${BLE_SIGNING_KEY:-dev-only-ble-signing-key-32-bytes}", ALLOW_STUB_ADAPTERS: "${ALLOW_STUB_ADAPTERS:-true}", WEBHOOK_SIGNING_KEY: "${WEBHOOK_SIGNING_KEY:?required}", WEBHOOK_TARGET_URL: "${WEBHOOK_TARGET_URL:-}"}
    networks: [private]
    depends_on: {postgres: {condition: service_healthy}}
  caddy:
    image: caddy:2.10.0
    environment: {FISCAL_SITE: "${FISCAL_SITE:-http://localhost}", FISCAL_UPSTREAM: "${FISCAL_UPSTREAM:-fiscal-backend:8080}"}
    ports: ["${FISCAL_HTTP_PORT:-8080}:80", "${FISCAL_HTTPS_PORT:-8443}:443"]
    volumes: [./deploy/fiscalisation/Caddyfile:/etc/caddy/Caddyfile:ro, fiscal_caddy:/data]
    networks: [private, ingress]
    depends_on: [fiscal-backend]
networks: {private: {internal: true}, ingress: {}}
volumes: {fiscal_pg: {}, fiscal_caddy: {}}
