openapi: 3.1.0
info:
  title: BeeFiscal External Systems API
  version: 2026-08-16
servers:
  - url: https://fiscal.example.com
paths:
  /platform/v1/external-systems:
    get: {operationId: listExternalSystems, security: [{platformOIDC: []}], responses: {'200': {description: External systems}}}
    post:
      operationId: createExternalSystem
      security: [{platformOIDC: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalSystemInput'}}}}
      responses: {'201': {description: System and reveal-once bootstrap token}, '400': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /platform/v1/external-systems/{system_id}:
    parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateExternalSystem
      security: [{platformOIDC: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExternalSystemUpdate'}}}}
      responses: {'200': {description: Updated system}, '409': {$ref: '#/components/responses/Error'}}
  /platform/v1/external-systems/{system_id}:rotate-key:
    post: {operationId: rotateExternalSystemKey, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: Reveal-once replacement key}, '404': {$ref: '#/components/responses/Error'}}}
  /platform/v1/external-systems/{system_id}:suspend:
    post: {operationId: suspendExternalSystem, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'204': {description: Suspended}}}
  /platform/v1/external-systems/{system_id}:resume:
    post: {operationId: resumeExternalSystem, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'204': {description: Active}}}
  /platform/v1/external-systems/{system_id}/audit-events:
    get: {operationId: listExternalSystemAudit, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Append-only audit events}}}
  /platform/v1/external-systems/{system_id}/tenant-bindings:
    get: {operationId: listExternalSystemBindings, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Tenant bindings}}}
  /platform/v1/external-systems/{system_id}/webhook-deliveries:
    get: {operationId: listExternalSystemDeliveries, security: [{platformOIDC: []}], parameters: [{name: system_id, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Delivery and attempt journal}}}
  /platform/v1/webhook-deliveries/{delivery_id}:requeue:
    post: {operationId: requeueWebhookDelivery, security: [{platformOIDC: []}], parameters: [{name: delivery_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'204': {description: Dead delivery requeued}, '409': {$ref: '#/components/responses/Error'}}}
  /platform/v1/integration-metrics:
    get: {operationId: getIntegrationMetrics, security: [{platformOIDC: []}], responses: {'200': {description: 'Queue, security and conflict metrics'}}}
  /platform/v1/enrollment-conflicts:
    get: {operationId: listEnrollmentConflicts, security: [{platformOIDC: []}], responses: {'200': {description: Conflicts awaiting decision}}}
  /platform/v1/enrollment-conflicts/{challenge_id}:resolve:
    post:
      operationId: resolveEnrollmentConflict
      security: [{platformOIDC: []}]
      parameters: [{name: challenge_id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [decision, reason], properties: {decision: {enum: [KEEP_EXISTING, REPLACE_EXISTING]}, reason: {type: string, minLength: 1}}}}}}
      responses: {'204': {description: Decision applied}, '404': {$ref: '#/components/responses/Error'}}
  /integration/v1/enrollments:
    post:
      operationId: startEnrollment
      security: [{systemToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentRequest'}}}}
      responses:
        '202': {description: OTP challenge created, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentChallenge'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /integration/v1/enrollments:verify:
    post:
      operationId: verifyEnrollment
      security: [{temporaryToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses:
        '200': {description: Tenant binding and reveal-once credential, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentResult'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /integration/v1/credentials:recover:
    post:
      operationId: startCredentialRecovery
      security: [{systemToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialRecoveryRequest'}}}}
      responses:
        '202': {description: Generic OTP recovery challenge, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentChallenge'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /integration/v1/credentials:recover-verify:
    post:
      operationId: verifyCredentialRecovery
      security: [{recoveryToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses:
        '200': {description: Rotated reveal-once tenant credential, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentResult'}}}}
        '401': {$ref: '#/components/responses/Error'}
  /integration/v1/organization:
    put:
      operationId: putOrganization
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationResource'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /integration/v1/locations/{source_id}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    put:
      operationId: putLocation
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LocationResource'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      operationId: deleteLocation
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /integration/v1/registers/{source_id}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    put:
      operationId: putRegister
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterResource'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      operationId: deleteRegister
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /integration/v1/operators/{source_id}:
    parameters: [{$ref: '#/components/parameters/SourceId'}]
    put:
      operationId: putOperator
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperatorResource'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    delete:
      operationId: deleteOperator
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/SourceVersion'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      responses: {'202': {$ref: '#/components/responses/Accepted'}, '400': {$ref: '#/components/responses/Error'}, '401': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /integration/v1/operations/{operation_id}:
    get:
      operationId: getIntegrationOperation
      security: [{tenantToken: []}]
      parameters: [{name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Operation state, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /integration/v1/credentials:rotate:
    post:
      operationId: rotateTenantCredential
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Reveal-once replacement credential, content: {application/json: {schema: {$ref: '#/components/schemas/EnrollmentResult'}}}}, '401': {$ref: '#/components/responses/Error'}}
  /integration/v1/credentials:revoke:
    post:
      operationId: revokeTenantCredential
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      responses: {'204': {description: Credential immediately revoked}, '401': {$ref: '#/components/responses/Error'}}
  /integration/v1/binding:
    patch:
      operationId: updateSourceCompanyId
      security: [{tenantToken: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/ActorType'}, {$ref: '#/components/parameters/ActorId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [source_company_id, expected_version], properties: {source_company_id: {type: string, minLength: 1}, expected_version: {type: integer, minimum: 1}}}}}}
      responses: {'204': {description: Binding updated and journaled}, '409': {$ref: '#/components/responses/Error'}}
webhooks:
  integrationCommandUpdated:
    post:
      operationId: receiveIntegrationCommandUpdate
      security: []
      parameters:
        - {name: BeeFiscal-Event-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: BeeFiscal-Source-System-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: BeeFiscal-Delivery-Id, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: BeeFiscal-Signature, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookEvent'}}}}
      responses: {'204': {description: Accepted and durably deduplicated}}
components:
  securitySchemes:
    platformOIDC: {type: openIdConnect, openIdConnectUrl: 'https://identity.example.com/.well-known/openid-configuration'}
    systemToken: {type: http, scheme: bearer, bearerFormat: 'sys_live_<id>.<secret>'}
    temporaryToken: {type: http, scheme: bearer, bearerFormat: 'enroll_tmp_<id>.<secret>'}
    recoveryToken: {type: http, scheme: bearer, bearerFormat: 'recover_tmp_<id>.<secret>'}
    tenantToken: {type: http, scheme: bearer, bearerFormat: 'tenant_live_<id>.<secret>'}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 255}}
    SourceVersion: {name: Source-Version, in: header, required: true, schema: {type: integer, minimum: 1}}
    ActorType: {name: BeeFiscal-Source-Actor-Type, in: header, required: true, schema: {type: string, enum: [USER, SERVICE]}}
    ActorId: {name: BeeFiscal-Source-Actor-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
    SourceId: {name: source_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
  responses:
    Accepted: {description: Durably accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptedOperation'}}}}
    Error: {description: Stable error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    ExternalSystemInput: {type: object, additionalProperties: false, required: [code, display_name, webhook_url, webhook_events], properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_-]{1,62}$'}, display_name: {type: string, minLength: 1}, webhook_url: {type: string, format: uri, pattern: '^https://'}, webhook_events: {type: array, items: {const: integration.command.updated}, minItems: 1, uniqueItems: true}}}
    ExternalSystemUpdate: {type: object, additionalProperties: false, required: [display_name, webhook_url, webhook_events, version], properties: {display_name: {type: string, minLength: 1}, webhook_url: {type: string, format: uri, pattern: '^https://'}, webhook_events: {type: array, items: {const: integration.command.updated}, minItems: 1, uniqueItems: true}, version: {type: integer, minimum: 1}}}
    TaxIdentifier:
      type: object
      additionalProperties: false
      required: [country, type, value]
      properties: {country: {type: string, pattern: '^[A-Z]{2}$'}, type: {type: string, pattern: '^[A-Z][A-Z0-9_-]{1,62}$'}, value: {type: string, minLength: 3, maxLength: 128}}
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [email, source_company_id, company]
      properties:
        email: {type: string, format: email}
        source_company_id: {type: string, minLength: 1, maxLength: 255}
        company:
          type: object
          additionalProperties: false
          required: [legal_name, tax_identifier]
          properties: {legal_name: {type: string}, tax_identifier: {$ref: '#/components/schemas/TaxIdentifier'}, address: {type: string}}
    EnrollmentChallenge: {type: object, required: [temporary_token, expires_at, resend_after], properties: {temporary_token: {type: string}, expires_at: {type: string, format: date-time}, resend_after: {type: string, format: date-time}}}
    CredentialRecoveryRequest: {type: object, additionalProperties: false, required: [email, tax_identifier], properties: {email: {type: string, format: email}, tax_identifier: {$ref: '#/components/schemas/TaxIdentifier'}}}
    OrganizationResource: {type: object, additionalProperties: false, required: [legal_name, tax_identifier], properties: {legal_name: {type: string, minLength: 1}, tax_identifier: {$ref: '#/components/schemas/TaxIdentifier'}, address: {type: string}, status: {enum: [ACTIVE, INACTIVE]}}}
    LocationResource: {type: object, additionalProperties: false, required: [name, address], properties: {code: {type: string}, name: {type: string, minLength: 1}, address: {type: string, minLength: 1}, status: {enum: [ACTIVE, INACTIVE]}}}
    RegisterResource: {type: object, additionalProperties: false, required: [location_source_id, name], properties: {code: {type: string}, name: {type: string, minLength: 1}, location_source_id: {type: string, minLength: 1}, status: {enum: [ACTIVE, BLOCKED, INACTIVE]}}}
    OperatorResource: {type: object, additionalProperties: false, required: [operator_code, first_name, last_name, roles], properties: {operator_code: {type: string, pattern: '^[A-Za-z0-9]{4}$'}, first_name: {type: string, minLength: 1}, last_name: {type: string, minLength: 1}, roles: {type: array, minItems: 1, items: {enum: [CASHIER, SUPERVISOR, ADMIN, AUDITOR, SERVICE]}}, status: {enum: [ACTIVE, INACTIVE]}, active_from: {type: string, format: date-time}}}
    EnrollmentResult: {type: object, required: [tenant_id, source_system_id, source_company_id, access_token, token_type, scopes], properties: {tenant_id: {type: string, format: uuid}, source_system_id: {type: string, format: uuid}, source_company_id: {type: string}, access_token: {type: string, writeOnly: true}, token_type: {const: Bearer}, scopes: {type: array, items: {type: string}}}}
    AcceptedOperation: {type: object, required: [operation_id, status, status_url, accepted_at], properties: {operation_id: {type: string, format: uuid}, status: {const: ACCEPTED}, status_url: {type: string, format: uri}, accepted_at: {type: string, format: date-time}}}
    Operation: {type: object, required: [operation_id, status, resource_type, source_entity_id, source_version], properties: {operation_id: {type: string, format: uuid}, status: {type: string, enum: [ACCEPTED, QUEUED, PROCESSING, SUCCEEDED, FAILED, DEAD, SUPERSEDED]}, resource_type: {type: string}, source_entity_id: {type: string}, source_version: {type: integer}, result: {type: object}}}
    WebhookEvent: {type: object, required: [event_id, event_type, source_system_id, tenant_id, operation_id, status, occurred_at], properties: {event_id: {type: string, format: uuid}, event_type: {const: integration.command.updated}, source_system_id: {type: string, format: uuid}, tenant_id: {type: string, format: uuid}, operation_id: {type: string, format: uuid}, resource_type: {type: string}, source_entity_id: {type: string}, source_version: {type: integer}, status: {type: string}, result: {type: object}, error: {type: [object, 'null']}, occurred_at: {type: string, format: date-time}}}
    Error: {type: object, additionalProperties: false, required: [error], properties: {error: {type: object, additionalProperties: false, required: [code, message], properties: {code: {type: string, enum: [INVALID_REQUEST, CREDENTIAL_INVALID, RATE_LIMITED, INTEGRATION_CONFLICT, NOT_FOUND, SYSTEM_SUSPENDED, ENROLLMENT_EXPIRED, ENROLLMENT_CODE_INVALID, ENROLLMENT_LOCKED, SOURCE_VERSION_CONFLICT, COMMAND_PAYLOAD_CONFLICT, WEBHOOK_DELIVERY_DEAD]}, message: {type: string}}}}}
