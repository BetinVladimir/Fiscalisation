[platformio]
default_envs = edge-agent-s3

[env:edge-agent-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/configure_build.py
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

lib_deps =
    siara-cc/Sqlite3Esp32@2.5

; Local libraries are symlinked under lib/ to keep one authoritative source.
lib_ldf_mode = deep+

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Set all three pins for a board without usable SD_MMC defaults.
    -DEDGE_SD_CLK=-1
    -DEDGE_SD_CMD=-1
    -DEDGE_SD_D0=-1
    -DEDGE_FISCAL_UART_RX=18
    -DEDGE_FISCAL_UART_TX=17
    -DEDGE_FISCAL_UART_BAUD=115200

build_unflags =
    -std=gnu++11

check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,performance,portability --inline-suppr
