name: beeminipos-${APP_ENV:-dev}
services:
  postgres:
    image: postgres:16.10
    environment: {POSTGRES_USER: minipos, POSTGRES_PASSWORD: "${MINIPOS_DB_PASSWORD:-dev-minipos-writer-password}", POSTGRES_DB: minipos, MINIPOS_RLS_DB_PASSWORD: "${MINIPOS_RLS_DB_PASSWORD:-dev-minipos-rls-password}"}
    volumes: [minipos_pg:/var/lib/postgresql/data, ./database/minipos:/docker-entrypoint-initdb.d:ro]
    networks: [private]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U minipos -d minipos"], interval: 5s, timeout: 3s, retries: 20}
  beeminipos-backend:
    build: ./minipos/beeminipos-backend
    restart: unless-stopped
    environment: {APP_ENV: "${APP_ENV:-dev}", HTTP_ADDR: ":8081", API_VERSION: "2026-08-07", DATABASE_URL: "postgres://minipos:${MINIPOS_DB_PASSWORD:-dev-minipos-writer-password}@${MINIPOS_DB_HOST:-postgres}:${MINIPOS_DB_PORT:-5432}/minipos?sslmode=disable", RLS_DATABASE_URL: "postgres://beeminipos_tenant:${MINIPOS_RLS_DB_PASSWORD:-dev-minipos-rls-password}@${MINIPOS_DB_HOST:-postgres}:${MINIPOS_DB_PORT:-5432}/minipos?sslmode=disable", AUTH_HMAC_KEY: "${AUTH_HMAC_KEY:-}", OIDC_ISSUER: "${OIDC_ISSUER:-}", OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}", OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}", FISCAL_PUBLIC_BASE_URL: "${FISCAL_PUBLIC_BASE_URL:-http://localhost:8080/public/v1}", FISCAL_AUTH_TOKEN: "${FISCAL_AUTH_TOKEN:-}", FISCAL_OAUTH_TOKEN_URL: "${FISCAL_OAUTH_TOKEN_URL:-}", FISCAL_OAUTH_CLIENT_ID: "${FISCAL_OAUTH_CLIENT_ID:-}", FISCAL_OAUTH_CLIENT_SECRET: "${FISCAL_OAUTH_CLIENT_SECRET:-}", FISCAL_OAUTH_SCOPE: "${FISCAL_OAUTH_SCOPE:-fiscal.base}", FISCAL_OAUTH_AUDIENCE: "${FISCAL_OAUTH_AUDIENCE:-}", LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM: "${LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM:-}", LOCAL_FISCAL_TOKEN_SIGNING_KID: "${LOCAL_FISCAL_TOKEN_SIGNING_KID:-minipos-local-1}", LOCAL_FISCAL_TOKEN_ISSUER: "${LOCAL_FISCAL_TOKEN_ISSUER:-beeminipos}", WEBHOOK_VERIFICATION_KEY: "${WEBHOOK_VERIFICATION_KEY:-dev-only-fiscal-webhook-key}"}
    networks: [private, egress]
    depends_on: {postgres: {condition: service_healthy}}
  miniposweb:
    build: ./minipos/miniposweb
    restart: unless-stopped
    networks: [private]
  caddy:
    image: caddy:2.10.0
    environment: {MINIPOS_SITE: "${MINIPOS_SITE:-http://localhost}", MINIPOS_UPSTREAM: "${MINIPOS_UPSTREAM:-beeminipos-backend:8081}", MINIPOS_WEB_UPSTREAM: "${MINIPOS_WEB_UPSTREAM:-miniposweb:8080}"}
    ports: ["${MINIPOS_HTTP_PORT:-8081}:80", "${MINIPOS_HTTPS_PORT:-8444}:443"]
    volumes: [./deploy/minipos/Caddyfile:/etc/caddy/Caddyfile:ro, minipos_caddy:/data]
    networks: [private, ingress]
    depends_on: [beeminipos-backend, miniposweb]
networks: {private: {internal: true}, ingress: {}, egress: {}}
volumes: {minipos_pg: {}, minipos_caddy: {}}
