name: BLE certificate native crypto gate
on:
  pull_request:
    paths: ['IoT/firmware/edge-agent-s3/idf/**', 'fiscal-backend/**', 'scripts/*ble*certificate*', 'scripts/verify-device-time-anchor-crypto-host.sh', 'scripts/tests/test_ble_certificate_crypto_gate.py', 'Makefile', '.github/workflows/ble-certificate-crypto.yml']
  push:
    paths: ['IoT/firmware/edge-agent-s3/idf/**', 'fiscal-backend/**', 'scripts/*ble*certificate*', 'scripts/verify-device-time-anchor-crypto-host.sh', 'scripts/tests/test_ble_certificate_crypto_gate.py', 'Makefile', '.github/workflows/ble-certificate-crypto.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize evidence even if checkout or tool setup fails
        run: |
          mkdir -p "$RUNNER_TEMP/ble-certificate-crypto-evidence"
          printf '{"status":"NOT_RUN","scope":"workflow bootstrap; native gate has not completed"}\n' > "$RUNNER_TEMP/ble-certificate-crypto-evidence/workflow-manifest.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: fiscal-backend/go.mod
          cache-dependency-path: fiscal-backend/go.sum
      - name: Mandatory actual C++/mbedTLS proof, certificate profile and time-anchor crypto
        run: make ble-certificate-crypto-test BLE_CERTIFICATE_CRYPTO_EVIDENCE_DIR="$RUNNER_TEMP/ble-certificate-crypto-evidence"
      - name: Record workflow result
        if: always()
        run: |
          printf '{"job_status":"%s","scope":"native host gate; full IDF and hardware acceptance are separate"}\n' '${{ job.status }}' > "$RUNNER_TEMP/ble-certificate-crypto-evidence/workflow-manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ble-certificate-native-crypto-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ble-certificate-crypto-evidence/**/*.log
            ${{ runner.temp }}/ble-certificate-crypto-evidence/**/*manifest.json
            ${{ runner.temp }}/ble-certificate-crypto-evidence/**/time-anchor.log
            ${{ runner.temp }}/ble-certificate-crypto-evidence/**/time-anchor-build-manifest.json
            ${{ runner.temp }}/ble-certificate-crypto-evidence/manifest.json
            ${{ runner.temp }}/ble-certificate-crypto-evidence/workflow-manifest.json
