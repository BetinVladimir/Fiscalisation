name: IoT device protocol regression
on:
  pull_request:
    paths: ['IoT/common-modules/**', 'IoT/protocol-abstraction/**', 'Makefile', '.github/workflows/iot-protocols.yml']
  push:
    paths: ['IoT/common-modules/**', 'IoT/protocol-abstraction/**', 'Makefile', '.github/workflows/iot-protocols.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Existing device protocol and codec suites with host GCC
        shell: bash
        run: |
          set -euo pipefail
          c++ --version
          make iot-protocol-test
