name: integration-contract
on: [pull_request, push]
jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: docs/integration-kit/package-lock.json}
      - run: npm ci
        working-directory: docs/integration-kit
      - run: npm run generate
        working-directory: docs/integration-kit
      - run: git diff --exit-code -- docs/integration-kit/typescript/types.generated.ts fiscal-backend/internal/integration/resource_schemas_gen.go
      - run: npm run lint:contract
        working-directory: docs/integration-kit
      - run: npm run typecheck
        working-directory: docs/integration-kit
      - name: Reject breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:docs/integration-kit/openapi.yaml" > /tmp/base-openapi.yaml
          docker run --rm -v "$PWD:/work" -v /tmp:/base tufin/oasdiff:latest breaking /base/base-openapi.yaml /work/docs/integration-kit/openapi.yaml --fail-on WARN
      - run: npm run check:static
        working-directory: docs/integration-kit
  server2server-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: fiscal_contract_${{ github.run_id }}_${{ github.run_attempt }}
      COMPOSE_FILE: compose.fiscalisation.yaml:compose.fiscalisation.dev.yaml:compose.fiscalisation.e2e.yaml
      FISCAL_DB_PASSWORD: dev-fiscal-writer-password
      FISCAL_RLS_DB_PASSWORD: dev-fiscal-rls-password
      AUTH_HMAC_KEY: server2server-e2e-signing-key-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-go@v5
        with:
          go-version-file: fiscal-backend/go.mod
          cache-dependency-path: fiscal-backend/go.sum
      - name: Prepare disposable canonical SQL fixture
        run: |
          fixture_dir="$RUNNER_TEMP/fiscal-contract-init"
          python3 scripts/prepare-fiscal-pg-fixture.py --source database/fiscal --output "$fixture_dir" --namespace fiscal
          echo "FISCAL_E2E_INIT_DIR=$fixture_dir" >> "$GITHUB_ENV"
      - name: Start Fiscal integration stack including HTTP entrypoint
        run: docker compose up -d --build caddy
      - name: Wait for Fiscal
        run: |
          for i in $(seq 1 120); do
            if curl --max-time 2 -fsS http://localhost:8080/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker compose ps
          exit 1
      - name: Enrollment and Rabbit projection E2E
        run: sh scripts/e2e-server2server.sh
      - name: BeeFiscalApp session concurrency
        env:
          PG_INTEGRATION_URL: postgres://fiscal:dev-fiscal-writer-password@localhost:5433/fiscal?sslmode=disable
        run: go test ./internal/integration -run 'TestApp(TenantSelection|RefreshRotation)' -count=1 -v -timeout=120s
        working-directory: fiscal-backend
      - if: always()
        run: docker compose down -v --remove-orphans
