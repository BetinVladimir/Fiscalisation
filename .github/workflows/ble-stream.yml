name: Reliable GATT stream core
on:
  pull_request:
    paths: ['IoT/common-modules/ble-stream/**', 'Makefile', '.github/workflows/ble-stream.yml']
  push:
    paths: ['IoT/common-modules/ble-stream/**', 'Makefile', '.github/workflows/ble-stream.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Sanitized C and actual TypeScript peer fault tests
        run: make ble-stream-test BLE_STREAM_EVIDENCE_DIR="$RUNNER_TEMP/ble-stream-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ble-stream-core-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/ble-stream-evidence
