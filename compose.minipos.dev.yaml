services:
  dap-minio:
    ports:
      - "127.0.0.1:${DAP_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${DAP_MINIO_CONSOLE_PORT:-9001}:9001"
  beeminipos-backend:
    environment:
      APP_ENV: dev
      AUTH_HMAC_KEY: "${AUTH_HMAC_KEY:-dev-only-minipos-auth-signing-key-32-bytes}"
      FISCAL_SYSTEM_TOKEN: "${FISCAL_SYSTEM_TOKEN:-}"
      FISCAL_CREDENTIAL_ENCRYPTION_KEY_BASE64: "${FISCAL_CREDENTIAL_ENCRYPTION_KEY_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      FISCAL_CREDENTIAL_KEK_ID: "${FISCAL_CREDENTIAL_KEK_ID:-dev/minipos/fiscal}"
      SMTP_HOST: "${MINIPOS_SMTP_HOST:-host.docker.internal}"
      SMTP_PORT: "${MINIPOS_SMTP_PORT:-25}"
      SMTP_FROM: "${MINIPOS_SMTP_FROM:-noreply@beeloy.com}"
      FISCAL_AUTH_TOKEN: "${FISCAL_AUTH_TOKEN:-}"
      FISCAL_OAUTH_CLIENT_SECRET: "${FISCAL_OAUTH_CLIENT_SECRET:-}"
      WEBHOOK_VERIFICATION_KEY: "${WEBHOOK_VERIFICATION_KEY:-dev-only-fiscal-webhook-key}"
      LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM: "${LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM:-}"
  caddy:
    environment:
      MINIPOS_SITE: :80
