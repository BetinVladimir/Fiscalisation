services:
  emqx:
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "${EMQX_DASHBOARD_PASSWORD:?required}"
      EMQX_AUTHENTICATION__1__SECRET: "${EMQX_JWT_SECRET:?required}"
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?required}"
  fiscal-backend:
    environment:
      APP_ENV: prod
      ALLOW_STUB_ADAPTERS: "false"
      PUBLIC_BASE_URL: "${FISCAL_PUBLIC_BASE_URL:?required}"
      CORS_ALLOWED_ORIGINS: "${FISCAL_CORS_ALLOWED_ORIGINS:?required}"
      AUTH_HMAC_KEY: ""
      OIDC_ISSUER: "${OIDC_ISSUER:?required}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:?required}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:?required}"
      BLE_SIGNING_KEY: "${BLE_SIGNING_KEY:?required}"
      WEBHOOK_SIGNING_KEY: "${WEBHOOK_SIGNING_KEY:?required}"
      EMQX_BROKER: "${EMQX_BROKER:?required}"
      EMQX_CLIENT_ID: "${EMQX_CLIENT_ID:-beefiscal-backend}"
      EMQX_USERNAME: "${EMQX_USERNAME:?required}"
      EMQX_TOKEN: "${EMQX_TOKEN:?required}"
      EMQX_SUB_TOPICS: "tenants/+/devices/+/sync/batches/+,tenants/+/devices/+/status,tenants/+/devices/+/bindings/acks,beefiscal/v1/devices/+/activation"
      DEVICE_CA_CERT_FILE: "/run/beefiscal/device-pki/device-ca.crt"
      DEVICE_CA_KEY_FILE: "/run/beefiscal/device-pki/device-ca.key"
      DEVICE_MQTT_TLS_URI: "${DEVICE_MQTT_TLS_URI:?required}"
      DEVICE_MQTT_WSS_URI: "${DEVICE_MQTT_WSS_URI:?required}"
      LOCAL_FISCAL_TOKEN_ISSUER: "${LOCAL_FISCAL_TOKEN_ISSUER:?required}"
      LOCAL_FISCAL_TOKEN_SIGNING_KID: "${LOCAL_FISCAL_TOKEN_SIGNING_KID:?required}"
      LOCAL_FISCAL_TOKEN_PUBLIC_KEY_DER_BASE64: "${LOCAL_FISCAL_TOKEN_PUBLIC_KEY_DER_BASE64:?required}"
      SPA_DEPLOYMENT_DESCRIPTOR_URL: "${SPA_DEPLOYMENT_DESCRIPTOR_URL:?required}"
      SPA_DEPLOYMENT_SIGNING_KID: "${SPA_DEPLOYMENT_SIGNING_KID:?required}"
      SPA_DEPLOYMENT_PUBLIC_KEY_DER_BASE64: "${SPA_DEPLOYMENT_PUBLIC_KEY_DER_BASE64:?required}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    environment:
      FISCAL_SITE: "${FISCAL_SITE:?required}"
    security_opt: [no-new-privileges:true]
