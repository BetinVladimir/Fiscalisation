openapi: 3.1.0
info:
  title: Beeloy Local Fiscal Adapter API
  version: 2026-08-14
servers:
  - url: http://adapter.local/beeloy/local/v1
paths:
  /healthz:
    get:
      operationId: localAdapterLiveness
      security: []
      responses:
        '200': {description: Alive, content: {application/json: {schema: {$ref: '#/components/schemas/Liveness'}}}}
  /readyz:
    get:
      operationId: localAdapterReadiness
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceState'}}}}
        '503': {$ref: '#/components/responses/Problem'}
  /device:
    get:
      operationId: getLocalAdapterDevice
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Device state, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceState'}}}}
  /deployment:
    get:
      operationId: getLocalDeployment
      security: []
      responses:
        '200': {description: Active deployment, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentState'}}}}
  /intents:
    post:
      operationId: submitLocalFiscalIntent
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/APIVersion'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FiscalIntent'}}}
      responses:
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '202': {description: Durably accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /operations/{operation_id}:
    get:
      operationId: getLocalOperation
      security: [{bearerAuth: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Persisted operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /operations/{operation_id}:reconcile:
    post:
      operationId: reconcileLocalOperation
      security: [{bearerAuth: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/APIVersion'}
      responses:
        '202': {description: Lookup-only recovery accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    APIVersion: {name: X-Beeloy-API-Version, in: header, required: true, schema: {const: '2026-08-14'}}
  responses:
    Problem: {description: RFC 9457 problem, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, api_version]
      properties: {status: {const: alive}, api_version: {const: '2026-08-14'}}
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: {amount: {type: string, pattern: '^[0-9]+\\.[0-9]{2}$'}, currency: {const: EUR}}
    Item:
      type: object
      additionalProperties: false
      required: [item_id, name, quantity, unit_price, tax_group]
      properties:
        item_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        quantity: {type: string, pattern: '^[0-9]+\\.[0-9]{3}$'}
        unit_price: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        tax_group: {type: string, enum: [A, B, C, D]}
    Payment:
      type: object
      additionalProperties: false
      required: [payment_id, type, amount]
      properties:
        payment_id: {type: string, format: uuid}
        type: {type: string, enum: [CASH, CARD]}
        amount: {$ref: '#/components/schemas/Money'}
    FiscalIntent:
      type: object
      additionalProperties: false
      required: [protocol_version, intent_id, action, client_operation_id, receipt_session_id, client_sale_surrogate_id, server_sale_id, operator_code, tenant_id, location_id, register_id, edge_device_id, binding_generation, command, items, payments, canonical_payload, payload_sha256]
      properties:
        protocol_version: {const: '1.0'}
        intent_id: {type: string, format: uuid, description: Must equal client_operation_id}
        action: {type: string, enum: [SALE_FINALIZE, SALE_REVERSE, REPORT_X, REPORT_Z, CASH_IN, CASH_OUT, PRINTER_TEST], description: Must equal command}
        client_operation_id: {type: string, format: uuid}
        receipt_session_id: {type: string, format: uuid}
        client_sale_surrogate_id: {type: string, format: uuid}
        server_sale_id: {type: string, format: uuid}
        operator_code: {type: string, pattern: '^[A-Za-z0-9]{4}$'}
        tenant_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        register_id: {type: string, format: uuid}
        edge_device_id: {type: string, format: uuid}
        binding_generation: {type: integer, minimum: 1}
        command: {type: string, enum: [SALE_FINALIZE, SALE_REVERSE, REPORT_X, REPORT_Z, CASH_IN, CASH_OUT, PRINTER_TEST]}
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Item'}}
        payments: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Payment'}}
        metadata: {type: object, additionalProperties: true}
        canonical_payload:
          type: object
          additionalProperties: true
          description: Canonical command-specific object hashed by payload_sha256. Sale commands contain currency/server_sale_id/external_id/location_id/operator_id/items/payments/metadata; administrative commands contain metadata and their typed command arguments.
        payload_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    Operation:
      type: object
      additionalProperties: false
      required: [operation_id, state, certainty, updated_at]
      properties:
        operation_id: {type: string, format: uuid}
        state: {type: string, enum: [RESERVED, EXECUTING, COMMITTED, FISCALIZED, REVERSED, PRINTER_TESTED, REJECTED, FAILED, COMPENSATED, UNKNOWN, RECOVERY_REQUIRED, FISCAL_RESULT_UNKNOWN]}
        certainty: {type: string, enum: [NOT_SENT, PROVEN_SUCCESS, PROVEN_FAILURE, UNKNOWN]}
        fiscal_reference: {type: string}
        terminal_reference: {type: string}
        error_code: {type: string}
        updated_at: {type: string, format: date-time}
    EndpointState:
      type: object
      additionalProperties: false
      required: [role, configured, reachable, state]
      properties:
        role: {type: string, enum: [ADAPTER, FISCAL_DEVICE, PAYMENT_TERMINAL]}
        configured: {type: boolean}
        reachable: {type: boolean}
        state: {type: string, enum: [READY, DEGRADED, OFFLINE, MISCONFIGURED, STALE]}
        last_error: {type: string}
    DeviceState:
      type: object
      additionalProperties: false
      required: [adapter_device_id, register_id, binding_generation, state, endpoints, observed_at]
      properties:
        adapter_device_id: {type: string, format: uuid}
        register_id: {type: string, format: uuid}
        binding_generation: {type: integer, minimum: 1}
        state: {type: string, enum: [READY, DEGRADED, OFFLINE, MISCONFIGURED, STALE]}
        endpoints: {type: array, items: {$ref: '#/components/schemas/EndpointState'}}
        observed_at: {type: string, format: date-time}
    DeploymentState:
      type: object
      additionalProperties: false
      required: [application_id, version, build_id, state]
      properties:
        application_id: {type: string}
        version: {type: string}
        build_id: {type: string}
        state: {type: string, enum: [AVAILABLE, DOWNLOADING, VERIFIED, ACTIVE, FAILED, ROLLED_BACK]}
        error_code: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties: {type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}}
