openapi: 3.1.0
info:
  title: BeeFiscal runtime and MiniPOS completion API
  version: '2026-08-07'
  description: >-
    OpenAPI completion document for executable endpoints not present in the
    regulatory public contract lock. Business schemas remain compatible with
    openapi-public-v1.yaml. Internal Edge endpoints are DEV/HIL only and are
    not mounted in PROD.
servers:
  - url: https://fiscal.example.invalid/public/v1
    description: BeeFiscal public Caddy ingress
  - url: https://pos.example.invalid/public/v1
    description: MiniPOS public Caddy ingress
  - url: http://127.0.0.1:8082
    description: Edge loopback DEV/HIL listener
paths:
  /operations/{operation_id}:reconcile:
    post:
      operationId: reconcileOperationExactAlias
      description: Lookup-only reconciliation; never blindly repeats the device side effect.
      security: [{oidcBearer: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '202': {description: Reconciliation transition, content: {application/json: {schema: {$ref: '#/components/schemas/FiscalOperationSummary'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /workstations/{workstation_id}/sessions:
    post:
      operationId: createWorkstationSession
      description: Binds authenticated subject, app instance, active operator and workstation before any sale intent.
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/WorkstationId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateWorkstationSessionRequest'}}}}
      responses:
        '201': {description: Bound operator/workstation session, content: {application/json: {schema: {$ref: '#/components/schemas/WorkstationSession'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /sales:
    get:
      operationId: listOpenSalesForRecovery
      description: Authoritative sale recovery by the authenticated tenant and optional operator/workstation/state filters.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - {name: operator_id, in: query, schema: {type: string}}
        - {name: register_id, in: query, schema: {type: string, format: uuid}}
        - {name: state, in: query, schema: {type: string, enum: [OPEN, PAYMENT_PENDING, UNKNOWN, COMPLETED, CANCELLED]}}
      responses:
        '200': {description: Server-owned recovery projection, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SUPTOSale'}}}}}}}
  /sales/{sale_id}/lines/{line_id}:
    patch:
      operationId: changeSaleLine
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/LineId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SUPTOSaleLine'}}}}
      responses:
        '200': {description: Changed by an append-only compensating event, content: {application/json: {schema: {$ref: '#/components/schemas/SUPTOSale'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /sales/{sale_id}/lines/{line_id}:cancel:
    post:
      operationId: cancelSaleLine
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/LineId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200': {description: Cancelled by an append-only compensating event, content: {application/json: {schema: {$ref: '#/components/schemas/SUPTOSale'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /sales/{sale_id}:cancel:
    post:
      operationId: cancelOpenSale
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '202': {description: Open sale cancelled while retaining UNP evidence, content: {application/json: {schema: {$ref: '#/components/schemas/FiscalOperationSummary'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /sales/{sale_id}:reverse:
    post:
      operationId: reverseSaleExactAlias
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SUPTOReversalRequest'}}}}
      responses:
        '202': {description: Storno operation, content: {application/json: {schema: {$ref: '#/components/schemas/FiscalOperationSummary'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /sales/{sale_id}/payment-intents:
    post:
      operationId: createPaymentIntent
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/SaleId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosTender'}}}}
      responses:
        '202': {description: Durable payment operation, content: {application/json: {schema: {$ref: '#/components/schemas/FiscalOperationSummary'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /workstations/{workstation_id}/readiness:
    get:
      operationId: getWorkstationReadiness
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/WorkstationId'}, {$ref: '#/components/parameters/ApiVersion'}]
      responses:
        '200': {description: Current signed readiness lease, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessLease'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /workstations/{workstation_id}/readiness:refresh:
    post:
      operationId: refreshWorkstationReadiness
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/WorkstationId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Fresh signed readiness lease, content: {application/json: {schema: {$ref: '#/components/schemas/ReadinessLease'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /workstations/{workstation_id}/clock-sync:
    post:
      operationId: syncWorkstationClock
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/WorkstationId'}, {$ref: '#/components/parameters/ApiVersion'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Append-only verified clock event, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceClockSync'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /sales:open-with-line:
    post:
      operationId: openSaleWithFirstLine
      summary: Атомарно открыть продажу первой строкой и выдать УНП
      description: >-
        Единственный BG_SUPTO_FULL entry point новой продажи. POS передаёт
        только surrogate UUID и намерение строки; FMIN, профиль и УНП
        определяются сервером. Создание sale, первой строки, audit и immutable
        regulatory binding является одной транзакцией.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenSaleWithFirstLineRequest'}
      responses:
        '201':
          description: Sale and first line durably opened
          headers:
            ETag: {required: true, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SUPTOSale'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exports/periodized:
    post:
      operationId: createPeriodizedComplianceExport
      description: >-
        Additive BG-020 export path using a half-open [from,to) interval. A
        request crossing 2026-01-01T00:00:00 Europe/Sofia produces separate
        BGN and EUR artifacts and never aggregates the two official currencies.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PeriodizedComplianceExportRequest'}}}
      responses:
        '202':
          description: Export completed or accepted under the durable operation contract
          content: {application/json: {schema: {$ref: '#/components/schemas/FiscalOperationSummary'}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exports/{export_id}/periods:
    get:
      operationId: getPeriodizedComplianceExport
      description: Returns non-overlapping official-currency period manifests for one export.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Periodized export
          content: {application/json: {schema: {$ref: '#/components/schemas/PeriodizedComplianceExport'}}}
        '404': {$ref: '#/components/responses/Problem'}
  /exports/{export_id}/artifacts/{artifact_id}:
    get:
      operationId: downloadPeriodizedComplianceExportArtifact
      description: Downloads an artifact only when it belongs to the tenant-owned export.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Immutable compliance export artifact
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/json: {schema: {type: string, format: binary}}
            text/csv: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Problem'}
  /minipos/configuration:
    get:
      operationId: getMiniPosConfiguration
      parameters: [{$ref: '#/components/parameters/ApiVersion'}]
      responses:
        '200':
          description: Autonomous single-location/workstation configuration
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosConfiguration'}}}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: saveMiniPosConfiguration
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          description: Omit only when creating the singleton; required for updates.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosConfigurationInput'}}}
      responses:
        '200':
          description: Created or updated autonomous configuration
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosConfiguration'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/shifts:
    get:
      operationId: listMiniPosShifts
      description: Restores shifts owned by the authenticated operator after app restart or re-authentication.
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/AppInstanceId'
        - name: employee_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: register_id
          in: query
          schema: {type: string, format: uuid}
        - name: state
          in: query
          schema: {type: string, enum: [OPEN, CLOSING, BLOCKED_RECONCILIATION, CLOSED]}
      responses:
        '200':
          description: Operator-owned shifts matching the recovery filters
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosShiftPage'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: openMiniPosShift
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MiniPosOpenShiftRequest'}
      responses:
        '201':
          description: Shift opened
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosShift'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/employees/{employee_id}/identity-binding:
    post:
      operationId: bindMiniPosEmployeeIdentity
      description: >-
        ADMIN-only immutable binding of one organization OIDC identity to one
        active MiniPOS employee. Raw subjects are hashed before persistence and
        are never returned by the API.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosIdentityBindingRequest'}}}
      responses:
        '201':
          description: Immutable identity binding created or idempotently returned
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosIdentityBinding'}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/operator-session:
    get:
      operationId: getMiniPosOperatorSession
      description: Resolves the authenticated OIDC identity to exactly one active employee.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/AppInstanceId'
      responses:
        '200':
          description: Current authenticated operator session
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosOperatorSession'}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: revokeMiniPosOperatorSession
      description: Durably revokes the current token fingerprint before the UI discards credentials.
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/AppInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '204': {description: Session revocation durably recorded}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/shifts/{shift_id}/close:
    post:
      operationId: closeMiniPosShift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200':
          description: Shift closed
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosShift'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/shifts/{shift_id}/reconcile:
    post:
      operationId: reconcileMiniPosShiftClose
      description: >-
        Resolves a BLOCKED_RECONCILIATION Z close without issuing a second fiscal
        command. If the original response was lost before an operation id was
        persisted, the same deterministic downstream idempotency key is replayed.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false}}}
      responses:
        '200':
          description: Shift closed with final Z operation and fiscal reference
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosShift'}}}
        '409': {$ref: '#/components/responses/Problem'}
  /minipos/orders/{order_id}:
    get:
      operationId: getMiniPosOrderRuntimeState
      description: >-
        Runtime completion of the locked MiniPosOrder response. allowed_actions
        is derived by the backend state machine and clients must fail closed
        when an action is absent.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Authoritative MiniPOS order state and permitted actions
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosOrderRuntimeState'}}}
        '404': {$ref: '#/components/responses/Problem'}
  /minipos/orders/{order_id}/checkout-batch:
    post:
      operationId: checkoutMiniPosOrderBatch
      description: >-
        Executes an explicit ordered set of partial tenders against one Fiscal
        sale. Each entry is independently CASH or CARD; the ambiguous
        single-value MIXED tender is intentionally forbidden. The sum must
        equal the order total and CARD entries require an active terminal.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosCheckoutBatchRequest'}}}
      responses:
        '202':
          description: Final fiscal operation after all ordered tenders
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosFiscalOperation'}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /minipos/orders/{order_id}/reversals:
    post:
      operationId: reverseMiniPosOrder
      description: >-
        Creates an append-only fiscal reversal for a completed MiniPOS order
        through the Fiscal public API. A successful reversal never edits or
        deletes the original order; an ambiguous result is retained as UNKNOWN
        for webhook/poll reconciliation and must not be blindly retried.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosReversalRequest'}}}
      responses:
        '202':
          description: Reversal operation result
          content: {application/json: {schema: {$ref: '#/components/schemas/MiniPosFiscalOperation'}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
  /fiscal-webhooks:
    post:
      operationId: receiveFiscalWebhookAtMiniPos
      security: [{webhookHmac: []}]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: BeeFiscal-Signature
          in: header
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FiscalWebhookEvent'}}}
      responses:
        '204': {description: Durably accepted and applied idempotently}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /internal/v1/final-device:
    get:
      operationId: probeFinalDeviceForHIL
      tags: [Edge DEV HIL]
      security: [{localBearer: []}]
      responses:
        '200':
          description: Final device is reachable
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceProbeResult'}}}
        '503':
          description: Final device is unavailable; fiscal sale must be blocked
          content: {application/json: {schema: {$ref: '#/components/schemas/DeviceProbeResult'}}}
  /internal/v1/commands:
    post:
      operationId: executeCanonicalEdgeCommandForHIL
      tags: [Edge DEV HIL]
      security: [{localBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EdgeRuntimeCommand'}}}
      responses:
        '200':
          description: Durable command result or replayed terminal result
          content: {application/json: {schema: {$ref: '#/components/schemas/EdgeRuntimeResult'}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /internal/v1/storage:
    get:
      operationId: getEdgeStorageStatusForHIL
      tags: [Edge DEV HIL]
      security: [{localBearer: []}]
      responses:
        '200':
          description: SQLite durable-media occupancy and threshold state
          content: {application/json: {schema: {$ref: '#/components/schemas/EdgeStorageStatus'}}}
        '503': {$ref: '#/components/responses/Problem'}
  /local/v1/intents:
    post:
      operationId: executeLocalComplianceIntent
      description: Loopback-only POS intent surface with the same server-owned sale semantics as the cloud gateway. It never accepts a vendor fiscal command or a caller-generated regulatory identifier.
      tags: [Edge Local Compliance]
      security: [{localBearer: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceIntent'}}}
      responses:
        '200':
          description: Durable local result or idempotently replayed result
          content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceIntentResult'}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    oidcBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    localBearer: {type: http, scheme: bearer}
    webhookHmac: {type: apiKey, in: header, name: BeeFiscal-Signature}
  parameters:
    SaleId: {name: sale_id, in: path, required: true, schema: {type: string}}
    LineId: {name: line_id, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: integer, minimum: 1}}
    WorkstationId:
      name: workstation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApiVersion: {name: X-Api-Version, in: header, required: true, schema: {type: string, const: '2026-08-07'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 255}}
    ShiftId: {name: shift_id, in: path, required: true, schema: {type: string, format: uuid}}
    OrderId: {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
    EmployeeId: {name: employee_id, in: path, required: true, schema: {type: string, format: uuid}}
    AppInstanceId: {name: X-App-Instance-Id, in: header, required: true, schema: {type: string, format: uuid}}
    ExportId: {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
    ArtifactId: {name: artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: RFC 9457 problem
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    CreateWorkstationSessionRequest:
      type: object
      additionalProperties: false
      required: [operator_code, app_instance_id]
      properties:
        operator_code: {type: string, pattern: '^[A-Za-z0-9]{4}$'}
        app_instance_id: {type: string, format: uuid}
    WorkstationSession:
      type: object
      additionalProperties: false
      required: [session_id, workstation_id, operator_id, operator_code, app_instance_id, expires_at, created_at]
      properties:
        session_id: {type: string}
        tenant_id: {type: string}
        workstation_id: {type: string, format: uuid}
        operator_id: {type: string}
        operator_code: {type: string, pattern: '^[A-Za-z0-9]{4}$'}
        app_instance_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    SUPTOReversalRequest:
      type: object
      additionalProperties: false
