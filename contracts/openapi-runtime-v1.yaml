        signature: {type: string, description: base64url HMAC-SHA256 over the exact Go JSON acknowledgement with an empty signature field.}
    Problem:
      type: object
      required: [status]
      properties:
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
