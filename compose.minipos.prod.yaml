services:
  dap-minio:
    environment:
      MINIO_ROOT_USER: "${DAP_MINIO_ROOT_USER:?required}"
      MINIO_ROOT_PASSWORD: "${DAP_MINIO_ROOT_PASSWORD:?required}"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  postgres:
    environment:
      POSTGRES_PASSWORD: "${MINIPOS_DB_PASSWORD:?required}"
      MINIPOS_RLS_DB_PASSWORD: "${MINIPOS_RLS_DB_PASSWORD:?required}"
  beeminipos-backend:
    environment:
      APP_ENV: prod
      CORS_ALLOWED_ORIGINS: "*"
      AUTH_HMAC_KEY: "${AUTH_HMAC_KEY:?required}"
      AUTH_TOKEN_ISSUER: "${AUTH_TOKEN_ISSUER:-beeminipos}"
      RABBITMQ_URL: "${MINIPOS_RABBITMQ_URL:?required}"
      FISCAL_PUBLIC_BASE_URL: "${FISCAL_PUBLIC_BASE_URL:?required}"
      FISCAL_AUTH_TOKEN: ""
      FISCAL_OAUTH_TOKEN_URL: "${FISCAL_OAUTH_TOKEN_URL:?required}"
      FISCAL_OAUTH_CLIENT_ID: "${FISCAL_OAUTH_CLIENT_ID:?required}"
      FISCAL_OAUTH_CLIENT_SECRET: "${FISCAL_OAUTH_CLIENT_SECRET:?required}"
      FISCAL_OAUTH_SCOPE: "${FISCAL_OAUTH_SCOPE:-fiscal.base}"
      FISCAL_OAUTH_AUDIENCE: "${FISCAL_OAUTH_AUDIENCE:-beefiscal}"
      WEBHOOK_VERIFICATION_KEY: "${WEBHOOK_VERIFICATION_KEY:?required}"
      LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM: "${LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM:?required}"
      LOCAL_FISCAL_TOKEN_SIGNING_KID: "${LOCAL_FISCAL_TOKEN_SIGNING_KID:?required}"
      LOCAL_FISCAL_TOKEN_ISSUER: "${LOCAL_FISCAL_TOKEN_ISSUER:-beeminipos}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    environment:
      MINIPOS_SITE: "${MINIPOS_SITE:?required}"
    security_opt: [no-new-privileges:true]
