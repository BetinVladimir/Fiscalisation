services:
  beeminipos-backend:
    environment:
      APP_ENV: prod
      CORS_ALLOWED_ORIGINS: "${MINIPOS_CORS_ALLOWED_ORIGINS:?required}"
      AUTH_HMAC_KEY: ""
      OIDC_ISSUER: "${OIDC_ISSUER:?required}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:?required}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:?required}"
      FISCAL_AUTH_TOKEN: ""
      FISCAL_OAUTH_TOKEN_URL: "${FISCAL_OAUTH_TOKEN_URL:?required}"
      FISCAL_OAUTH_CLIENT_ID: "${FISCAL_OAUTH_CLIENT_ID:?required}"
      FISCAL_OAUTH_CLIENT_SECRET: "${FISCAL_OAUTH_CLIENT_SECRET:?required}"
      FISCAL_OAUTH_SCOPE: "${FISCAL_OAUTH_SCOPE:-fiscal.base}"
      FISCAL_OAUTH_AUDIENCE: "${FISCAL_OAUTH_AUDIENCE:-beefiscal}"
      WEBHOOK_VERIFICATION_KEY: "${WEBHOOK_VERIFICATION_KEY:?required}"
      LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM: "${LOCAL_FISCAL_TOKEN_SIGNING_KEY_PEM:?required}"
      LOCAL_FISCAL_TOKEN_SIGNING_KID: "${LOCAL_FISCAL_TOKEN_SIGNING_KID:?required}"
      LOCAL_FISCAL_TOKEN_ISSUER: "${LOCAL_FISCAL_TOKEN_ISSUER:-beeminipos}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    environment:
      MINIPOS_SITE: "${MINIPOS_SITE:?required}"
    security_opt: [no-new-privileges:true]
