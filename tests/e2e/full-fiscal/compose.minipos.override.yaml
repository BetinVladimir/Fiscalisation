services:
  beeminipos-backend:
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SMTP_HOST: host.docker.internal
      SMTP_PORT: "${E2E_SMTP_PORT:-18025}"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: e2e-minipos@beeloy.test
      FISCAL_PUBLIC_BASE_URL: http://host.docker.internal:18000/public/v1
      FISCAL_SYSTEM_TOKEN: "${E2E_FISCAL_SYSTEM_TOKEN}"
      FISCAL_CREDENTIAL_ENCRYPTION_KEY_BASE64: "${E2E_CREDENTIAL_KEY}"
      FISCAL_CREDENTIAL_KEK_ID: e2e-kek-1
  caddy:
    networks: !override [private]
